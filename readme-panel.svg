
<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .cmd {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 13px;
        fill: #9ECE6A;
      }
      .body {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 12px;
        fill: #C0CAF5;
      }
      .muted {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        fill: #9AA5CE;
      }
      .key {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 12px;
        fill: #BB9AF7;
      }
      .val {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 12px;
        fill: #7DCFFF;
      }
      .dim {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        fill: #7982A9;
      }
      .user {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        fill: #9ECE6A;
      }
      .path {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        fill: #7AA2F7;
      }
    </style>
  </defs>

  <!-- Main terminal panel -->
  <rect
    x="20" y="20"
    width="640" height="280"
    rx="6"
    fill="#1A1B26"
    stroke="#292E42"
    stroke-width="0.8"
  />

  <!-- Terminal header -->
  <rect
    x="20" y="20"
    width="640" height="28"
    rx="6"
    fill="#16161E"
    stroke="#292E42"
    stroke-width="0.5"
  />
  <rect x="20" y="36" width="640" height="12" fill="#16161E"/>

  <text x="36" y="39"><tspan class="user">gabriel-mkv@manjaro</tspan><tspan class="muted">:</tspan><tspan class="path">~/about-me.md</tspan></text>
  <text x="644" y="39" text-anchor="end" class="muted">[RO]</text>

  <!-- About me -->
  <text x="36" y="72" class="cmd">$ cat about-me.md</text>
  <line x1="36" y1="82" x2="644" y2="82" stroke="#292E42" stroke-width="0.5"/>

  <text x="36" y="103" class="body">Desenvolvedor Backend em evolução contínua.</text>
  <text x="36" y="121" class="body">Foco em <tspan class="val">Java</tspan> e <tspan class="val">Spring Boot</tspan>.</text>
  <text x="36" y="139" class="body">Aprendendo, praticando e construindo projetos.</text>

  <!-- Section separator -->
  <line
    x1="36" y1="151"
    x2="644" y2="151"
    stroke="#292E42"
    stroke-width="0.5"
    stroke-dasharray="3 3"
  />

  <!-- Stack -->
  <text x="36" y="171" class="cmd">$ cat stack.yaml</text>

  <text x="36" y="190" class="key">lang:</text>
  <text x="166" y="190" class="val">Java</text>

  <text x="36" y="207" class="key">backend:</text>
  <text x="166" y="207" class="val">Spring Boot · Quarkus</text>

  <text x="36" y="224" class="key">database:</text>
  <text x="166" y="224" class="val">PostgreSQL · MongoDB</text>

  <text x="36" y="241" class="key">tooling:</text>
  <text x="166" y="241" class="val">Git · Maven · Docker · Linux</text>

  <text x="36" y="258" class="key">api_docs:</text>
  <text x="166" y="258" class="val">Swagger / OpenAPI</text>

  <!-- Status bar -->
  <rect x="20" y="272" width="640" height="28" fill="#24283B"/>
  <rect x="20" y="292" width="640" height="8" rx="6" fill="#24283B"/>

  <text x="36" y="290" class="dim">README.md · UTF-8</text>
  <text x="644" y="290" text-anchor="end" class="dim">Java · Learning</text>
</svg>
